<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — ReelScribe</title><link rel="stylesheet" href="/reelscribe.css"><link rel="stylesheet" href="/reelscribe-orange-theme.css"></head>
<body><main class="rs-login"><section class="rs-loginbox"><a class="rs-brand" href="/">Reel<span>Scribe</span><b>.</b></a><h1 style="font:800 34px Manrope;margin:28px 0 6px">Welcome back.</h1><p class="rs-muted">Sign in or create your free account.</p>
<div class="rs-tabs"><button id="tabLogin" class="active" onclick="switchTab('login')">Log in</button><button id="tabSignup" onclick="switchTab('signup')">Sign up</button></div>
<div id="loginView"><div id="loginStep1"><div class="rs-field"><label>Email address</label><input id="loginEmail" type="email" placeholder="you@example.com"></div><button class="rs-btn orange rs-wide" id="loginSendOtp" onclick="sendLoginOtp()">Send code →</button><div id="loginStep1Status" class="status-msg" style="display:none"></div></div>
<div id="loginStep2" style="display:none"><p class="rs-muted">Code sent to <b id="loginEmailShow"></b></p><div class="rs-field"><label>6-digit code</label><input id="loginOtp" inputmode="numeric" maxlength="6"></div><button class="rs-btn orange rs-wide" onclick="verifyLoginOtp()">Verify & continue →</button><button class="rs-btn rs-wide" id="loginResend" style="display:none;margin-top:8px" onclick="sendLoginOtp()">Resend code</button><div id="loginStep2Status" class="status-msg" style="display:none"></div></div></div>
<div id="signupView" style="display:none"><div id="signupStep1"><div class="rs-field"><label>Email address</label><input id="signupEmail" type="email" placeholder="you@example.com"></div><button class="rs-btn orange rs-wide" id="signupSendOtp" onclick="sendSignupOtp()">Create account →</button><div id="signupStep1Status" class="status-msg" style="display:none"></div></div>
<div id="signupStep2" style="display:none"><p class="rs-muted">Code sent to <b id="signupEmailShow"></b></p><div class="rs-field"><label>6-digit code</label><input id="signupOtp" inputmode="numeric" maxlength="6"></div><button class="rs-btn orange rs-wide" onclick="verifySignupOtp()">Verify & create →</button><button class="rs-btn rs-wide" id="signupResend" style="display:none;margin-top:8px" onclick="sendSignupOtp()">Resend code</button><div id="signupStep2Status" class="status-msg" style="display:none"></div></div></div>
<div style="text-align:center;margin-top:20px"><button class="rs-btn ghost" onclick="googleLogin()">Continue with Google</button></div><p style="color:#666;font-size:11px;text-align:center;margin-top:22px">By continuing, you agree to ReelScribe's Terms and Privacy Policy.</p></section></main>
<script src="/assets/js/login.js"></script></body></html>
